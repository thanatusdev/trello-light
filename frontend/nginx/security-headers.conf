# Security headers for every response. nginx only inherits add_header from the enclosing
# block when a location defines none of its own, so each location that sets add_header must
# include this file as well (see nginx.conf).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
