[project]
name = "trello-light-api"
version = "0.1.0"
description = "Kanban task manager API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "pwdlib[bcrypt]>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.33",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC", "RUF", "S"]
# Domain errors are named after the condition (TaskNotFound, InvalidToken), per CLAUDE.md.
ignore = ["N818"]

[tool.ruff.lint.isort]
# A local `alembic/` migrations dir would otherwise make ruff treat it as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use literal passwords and secrets as fixtures.
"tests/**" = ["S101", "S105", "S106", "S107"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Strict mode for the inner layers (mypy does not allow `strict` per module,
# so the individual strict flags are listed here).
[[tool.mypy.overrides]]
module = ["app.domain.*", "app.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest / coverage --------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's async layer runs code inside greenlets; without this, lines after
# an awaited DB call are reported as missed.
concurrency = ["greenlet", "thread"]
omit = ["app/infrastructure/celery_app.py"]
