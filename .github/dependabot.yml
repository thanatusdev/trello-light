version: 2

# Weekly updates; minor and patch bumps are grouped per ecosystem/directory to keep PR noise low.
# Major bumps arrive as individual PRs so each can be reviewed on its own.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned below 6.1 for typescript-eslint (see CLAUDE.md).
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    groups:
      docker-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
